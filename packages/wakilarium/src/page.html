<!doctype html>
<html lang="fr" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wakilarium</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23e0a21c' stroke-width='4'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; --bg: #0e0b08; --ink: #f2efe7; --doux: rgba(242,239,231,.6); --line: rgba(255,255,255,.14); --gold: #e0a21c; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace; }
  :root[data-theme="day"] { color-scheme: light; --bg: #f6f2ea; --ink: #12151c; --doux: rgba(18,21,28,.6); --line: rgba(18,21,28,.14); --gold: #b8820f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 14px 16px 40px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 6px 0 14px; }
  .marque { font-weight: 800; letter-spacing: -.02em; display: inline-flex; align-items: center; gap: 8px; }
  .marque .anneau { width: 16px; height: 16px; border: 3px solid var(--gold); border-radius: 50%; display: inline-block; }
  .marque small { font-weight: 500; color: var(--doux); }
  .droite { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button, a.btn { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 12px/1 var(--mono); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .pied { margin-top: 14px; color: var(--doux); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .pied code { font-family: var(--mono); font-size: 12px; color: var(--ink); background: rgba(127,127,127,.12); padding: 2px 6px; border-radius: 6px; }
  .pied a { color: var(--ink); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="marque"><span class="anneau" aria-hidden="true"></span>Wakilarium <small>by zelij.ai</small></span>
    <div class="droite">
      <button type="button" data-lang="fr" aria-pressed="true">FR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-theme-toggle aria-pressed="false">☀ Jour</button>
      <a class="btn" data-badge href="/badge.svg" target="_blank" rel="noopener">Badge</a>
      <a class="btn" data-export href="/export.wakil">Exporter la journée</a>
      <a class="btn" href="https://github.com/zelij-ai/wakilarium" target="_blank" rel="noopener">GitHub</a>
    </div>
  </header>
  <wakil-arium src="/state" live hours="24"></wakil-arium>
  <p class="pied">
    <span data-i18n="hook">Claude Code branché par le hook : chaque outil, chaque réponse arrive ici. Rien ne quitte cette machine.</span>
    <span>Page publique : <a data-public-link href="#">…</a></span>
    <span data-i18n="cmd">Partager un badge dans un README : <code>![Wakilarium](http://127.0.0.1:8798/badge.svg)</code></span>
  </p>
</div>
<script type="module" src="/wakilarium.js"></script>
<script type="module" src="/page.js"></script>
</body>
</html>
